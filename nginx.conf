events {}
http {
    server {
        listen $PORT;
        location / {
            proxy_pass http://127.0.0.1:8501;
            proxy_set_header Host $host;
        }
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
        }
    }
}
